# Shared settings for every proxied gadget.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Accept-Encoding "";      # plain HTML so the navbar can be added
proxy_buffering off;                      # live updates (Server-Sent Events) and big downloads
proxy_request_buffering off;              # stream big uploads straight through
proxy_connect_timeout 5s;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
client_max_body_size 0;
