<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="gadget-home" content="">
<title>Gadgets</title>
<link rel="icon" href="/_gadgets/icons/gadgets.svg" type="image/svg+xml">
<link rel="stylesheet" href="/home.css">
<script src="/_gadgets/nav.js" defer></script>
<script src="/home.js" defer></script>
</head>
<body>
<main>
  <header class="hero">
    <h1>Gadgets</h1>
    <p>Everything running on the PC and the Pi.</p>
    <div class="tools">
      <div class="viewsw" role="radiogroup" aria-label="Show as">
        <label title="Compact tiles"><input type="radio" name="view" value="tiles"><span><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></g></svg>Tiles</span></label>
        <label title="Cards that say what each one does"><input type="radio" name="view" value="cards" checked><span><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></g></svg>Cards</span></label>
      </div>
      <label class="search"><span class="visually-hidden">Filter</span>
        <input type="search" id="q" placeholder="Filter…" autocomplete="off"></label>
    </div>
  </header>
  <section><h2>Gadgets</h2><div class="cards big" id="gadget"></div></section>
  <section><h2>Services</h2><div class="cards" id="service"></div></section>
  <section><h2>In the background</h2><div class="cards" id="background"></div></section>
  <footer>Add things in <code>gadget-registry/registry.json</code> (kuraara/clowd-docker-stuff).
    · <a href="/ca.html">Trust the gadgets on a new phone or computer</a></footer>
</main>
</body>
</html>
