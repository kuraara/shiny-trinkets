# Round Timer (tools/trinket deploy round-timer). For now on the Pi, on its own port over plain
# HTTP, because the gadget registry (HTTPS) is on the PC. Moving behind the registry is a manifest
# change: host pc, a "proxy" block instead of "url", and the gadgets network here.
# The shared session (what lets you switch apps and come back) is one small file in the volume.
services:
  round-timer:
    image: round-timer:latest
    build: .
    container_name: round-timer
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8107:8080"
    volumes:
      - round-timer-data:/data
    environment:
      - GOMEMLIMIT=24MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    pids_limit: 32
volumes:
  round-timer-data:
