# Quote Finder search + index, on the PC. Reached through the gadget registry on :8104.
services:
  quote-finder:
    image: quote-finder:latest
    build: .
    container_name: quote-finder
    restart: unless-stopped
    environment:
      - INGEST_TOKEN=${INGEST_TOKEN}
      # "Make panels": scenes are cut by the extractor on the Pi, then sent to video-tools
      - CLIP_URL=http://<pi>:8105
      - VIDEO_TOOLS_URL=http://video-tools:8080
      - VIDEO_TOOLS_PUBLIC_URL=http://<pc>:8103   # fallback; pages ask the registry (gadgets.url)
      - VIDEO_TOOLS_TOKEN=${VIDEO_TOOLS_TOKEN:-}
    volumes:
      - quote-finder-data:/data
    # People use https://<pc>:8104 through the gadget registry. This direct, plain-HTTP
    # port is for machines: the subtitle extractor on the Pi (ingest) and agents (MCP at /mcp).
    ports:
      - "8124:8080"
    networks: [gadgets]
volumes:
  quote-finder-data:
networks:
  gadgets:
    external: true
