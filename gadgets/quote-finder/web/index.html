<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quote Finder</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
  <header class="brand">
    <img src="icon.svg" alt="">
    <div><h1>Quote Finder</h1><p class="sub" id="sub">Find the episode from a line you remember.</p></div>
  </header>

  <form id="form" class="searchbar" role="search">
    <label class="visually-hidden" for="q">Quote</label>
    <input id="q" name="q" type="search" placeholder="Type what you remember…" autocomplete="off" autofocus>
    <label class="regex" title="Treat the search as a regular expression"><input type="checkbox" id="regex"><span>.*</span></label>
    <label class="visually-hidden" for="title">Show or movie</label>
    <select id="title"><option value="">Everything</option><option value="kind:tv">All TV</option><option value="kind:movie">All movies</option></select>
  </form>
  <p class="hint" id="hint">Tips: words can be in any order and partly remembered. Put "exact words" in quotes. Tick <b>.*</b> for a regular expression, e.g. <code>just a little .+ uneven</code>.</p>

  <div id="status" class="status" aria-live="polite"></div>
  <ol id="results" class="results"></ol>

  <details class="coverage" id="coverage">
    <summary>What's searchable</summary>
    <div id="covSummary" class="muted"></div>
    <table><thead><tr><th>Title</th><th>Searchable</th><th>No subtitles</th></tr></thead><tbody id="covRows"></tbody></table>
  </details>
</main>
</body>
</html>
