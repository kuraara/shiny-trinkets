# Runs on the Pi, next to the media. Reads only; one file at a time at the lowest priority.
# PC_ADDR and VIDEO_DIR come from registry/site.local.json (tools/trinket deploy fills them in).
services:
  subtitle-extractor:
    image: subtitle-extractor:latest
    container_name: subtitle-extractor
    restart: unless-stopped
    environment:
      - INGEST_TOKEN=${INGEST_TOKEN}
      - INDEX_URL=http://${PC_ADDR:?set PC_ADDR}:8124   # Quote Finder direct (8104 is for people)
      - MEDIA_DIR=/media
      - ONLY=${ONLY}          # e.g. "TvShows/Mike Tyson Mysteries"; empty = whole library
      - RESCAN_HOURS=6
      # scene clips for Quote Finder's "make panels" (copied, not re-encoded)
      - CLIP_ADDR=:8105
      # OpenSubtitles (free account at opensubtitles.com, API key from "API consumers"):
      # used for files that would take over a minute to read, and files with no subtitles.
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
      - OPENSUBTITLES_USERNAME=${OPENSUBTITLES_USERNAME}
      - OPENSUBTITLES_PASSWORD=${OPENSUBTITLES_PASSWORD}
    ports:
      - "8105:8105"
    volumes:
      - ${VIDEO_DIR:?set VIDEO_DIR}:/media:ro
    mem_limit: 256m
    cpus: 1.0
