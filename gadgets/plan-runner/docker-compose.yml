# Plan Runner, personal instance (tools/trinket deploy plan-runner): Claude Code on the PC, port 8129.
# The work instance is the same image with EXECUTOR=codex and its own secrets; see README.md.
services:
  plan-runner:
    image: plan-runner:latest
    build: .
    container_name: plan-runner
    restart: unless-stopped
    ports:
      - "8129:8080"
    environment:
      - TOKEN=${PLANRUNNER_TOKEN:?set PLANRUNNER_TOKEN}     # MCP and API: Authorization: Bearer
      - EXECUTOR=claude
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}  # from "claude setup-token"
      - GIT_TOKEN=${GIT_TOKEN}                              # clones and pushes to github.com
      - GIT_NAME=${GIT_NAME:-Plan Runner}
      - GIT_EMAIL=${GIT_EMAIL:-plan-runner@localhost}
      - ASKME_URL=${ASKME_URL}                              # the agent may ask through Ask Me
      - ASKME_TOKEN=${ASKME_TOKEN}
      - TIME_LIMIT_MINUTES=120
    volumes:
      - plan-runner-data:/data
    mem_limit: 6g
    cpus: 6
volumes:
  plan-runner-data:
