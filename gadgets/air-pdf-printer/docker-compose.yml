# AirPrint → PDF on the Pi. iPhones and Macs see a printer called "PDF"; whatever you print
# lands as a PDF in PDF_DIR on the Pi (straight in, no subfolders), listed on port 8632.
# PI_ADDR and PDF_DIR come from registry/site.local.json (tools/trinket deploy fills them in).
# Host networking is needed for AirPrint discovery (mDNS), which is why this runs on the Pi:
# Docker Desktop on the Windows PC can't pass multicast through.
services:
  air-pdf-printer:
    image: thyrlian/air-pdf-printer:arm64   # "latest" is amd64-only and can't start on the Pi
    container_name: air-pdf-printer
    network_mode: host                      # CUPS on :631, Avahi (mDNS) on :5353
    volumes:
      - ${PDF_DIR:?set PDF_DIR}:/var/spool/cups-pdf
      - cups-jobs:/var/spool/cups   # job numbers keep counting across restarts (they're in the file names)
    # The Pi runs its own CUPS on 127.0.0.1:631, which stops this one listening on 0.0.0.0:631.
    # Listening on the Pi's LAN address (PI_ADDR) only avoids the clash, with no change on the Pi.
    command: >
      sh -c "sed -i 's/^Listen 0.0.0.0:631/Listen ${PI_ADDR:?set PI_ADDR}:631/' /etc/cups/cupsd.conf
      && (grep -q '^ServerAlias' /etc/cups/cupsd.conf || echo 'ServerAlias *' >> /etc/cups/cupsd.conf)
      && sed -i -e 's|^#*AnonDirName.*|AnonDirName /var/spool/cups-pdf|' -e 's|^#*Out .*|Out /var/spool/cups-pdf|' -e 's|^#*Spool .*|Spool /var/spool/cups-pdf-work|' /etc/cups/cups-pdf.conf
      && chown nobody /var/spool/cups-pdf && chmod 755 /var/spool/cups-pdf
      && start.sh && touch /var/log/cups/cups-pdf-PDF_log
      && tail -f /var/log/cups/error_log /var/log/cups/cups-pdf-PDF_log"
    mem_limit: 256m
    restart: unless-stopped

  # A plain file list of the printed PDFs, newest at the bottom, to open or save from a phone.
  printed-pdfs:
    image: nginx:1.30-alpine
    container_name: printed-pdfs
    ports:
      - "8632:80"
    volumes:
      - ${PDF_DIR:?set PDF_DIR}:/usr/share/nginx/html:ro
    command: >
      sh -c "printf 'server { listen 80; root /usr/share/nginx/html; charset utf-8;
      location / { autoindex on; autoindex_exact_size off; autoindex_localtime on; }
      location ~* [.]pdf$$ { add_header Content-Disposition inline; types { application/pdf pdf; } } }'
      > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"
    mem_limit: 32m
    restart: unless-stopped

volumes:
  cups-jobs:
